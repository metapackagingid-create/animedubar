<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090b10" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ADBR CMS" />
  <title>Animedubar CMS — Admin Mobile App</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { obsidian:'#090b10', panel:'#121621', brand:'#E50914', vip:'#F59E0B', safe:'#10B981' },
          fontFamily: { sans:['Inter','system-ui','sans-serif'], arabic:['Cairo','sans-serif'], display:['Outfit','Inter','sans-serif'] }
        }
      }
    };
  </script>
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { background:#090b10; color:#f4f4f5; margin:0; padding:0; overflow-x:hidden; overscroll-behavior-y:contain; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
    .safe-top { padding-top: max(env(safe-area-inset-top), 10px); }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 8px); }
    .vip-gradient { background: linear-gradient(135deg, #FDE047 0%, #F59E0B 50%, #D97706 100%); }
  </style>
</head>
<body class="bg-obsidian text-zinc-100 min-h-screen pb-24">

  <!-- ============================================================
       SECURITY GATE 1: MANDATORY ADMIN LOGIN (APPS SCRIPT BACKEND)
       ============================================================ -->
  <div id="adminLoginGate" class="fixed inset-0 z-[150] bg-[#090b10] flex items-center justify-center p-5 overflow-y-auto">
    <div class="w-full max-w-sm bg-panel border border-amber-500/30 rounded-3xl p-6 space-y-5 shadow-2xl">
      <div class="text-center space-y-2">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center text-3xl">🛡️</div>
        <h1 class="font-display font-black text-2xl text-white">ANIMEDUBAR CMS</h1>
        <p class="text-xs text-zinc-400">Aplikasi HP khusus Pemilik &amp; Admin. Terlindungi RBAC 7 Role + Token HMAC Apps Script.</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-zinc-300 font-semibold mb-1">URL Google Apps Script Web App *</label>
          <input id="admGasUrl" type="url" required placeholder="https://script.google.com/macros/s/.../exec" class="w-full bg-[#0a0d14] border border-white/15 rounded-xl px-3.5 py-2.5 text-emerald-300 font-mono text-[11px]" />
        </div>
        <div>
          <label class="block text-zinc-300 font-semibold mb-1">Email Admin *</label>
          <input id="admEmail" type="email" required placeholder="admin@animedubar.com" class="w-full bg-[#0a0d14] border border-white/15 rounded-xl px-3.5 py-2.5 text-white" />
        </div>
        <div>
          <label class="block text-zinc-300 font-semibold mb-1">Password Admin *</label>
          <input id="admPass" type="password" required placeholder="••••••••••••" class="w-full bg-[#0a0d14] border border-white/15 rounded-xl px-3.5 py-2.5 text-white" />
        </div>
        <div>
          <label class="block text-zinc-300 font-semibold mb-1">Kode 2FA (Jika Aktif)</label>
          <input id="admTotp" type="text" placeholder="Opsional" class="w-full bg-[#0a0d14] border border-white/15 rounded-xl px-3.5 py-2.5 text-amber-300 font-mono" />
        </div>
        <button id="admLoginBtn" type="submit" class="w-full py-3 rounded-xl vip-gradient text-black font-extrabold text-sm shadow-lg">Masuk ke Panel Admin</button>
      </form>

      <div class="pt-2 border-t border-white/10 flex items-center justify-between gap-2 text-[11px]">
        <button type="button" onclick="triggerAdminPwaInstall()" class="text-emerald-400 font-bold underline">📲 Instal ke Layar HP</button>
        <button type="button" onclick="enterOfflineDemoAdmin()" class="text-zinc-400 hover:text-zinc-200">Mode Preview Offline</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       SECURITY GATE 2: 6-DIGIT LOCAL APP LOCK PIN (IDLE AUTO-LOCK)
       ============================================================ -->
  <div id="pinLockOverlay" class="hidden fixed inset-0 z-[160] bg-[#07090e]/98 backdrop-blur-xl flex items-center justify-center p-6">
    <div class="w-full max-w-xs text-center space-y-5">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-2xl">🔒</div>
      <div>
        <h2 class="text-lg font-black text-white">Aplikasi Admin Terkunci</h2>
        <p class="text-xs text-zinc-400 mt-0.5">Masukkan PIN 6 digit untuk membuka sesi CMS</p>
      </div>
      <input id="pinUnlockInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" class="w-full text-center tracking-[0.5em] text-2xl font-mono font-black bg-panel border border-white/20 rounded-2xl py-3.5 text-amber-300 focus:border-amber-400 focus:outline-none" />
      <button type="button" onclick="verifyAppLockPin()" class="w-full py-3 rounded-xl vip-gradient text-black font-extrabold text-sm">Buka Kunci</button>
      <button type="button" onclick="logoutAdminSession()" class="text-xs text-red-400 underline">Logout Sesi Admin</button>
    </div>
  </div>

  <!-- ============================================================
       ADMIN TOP BAR
       ============================================================ -->
  <header class="fixed top-0 left-0 right-0 z-40 safe-top px-4 pb-3 bg-[#0c0f17]/95 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-lg shrink-0">🛡️</div>
        <div class="min-w-0 leading-tight">
          <h1 class="font-display font-black text-base text-white truncate">ADBR CMS Admin</h1>
          <p id="hdrRoleBadge" class="text-[10px] font-bold text-amber-400 truncate">SUPER_ADMIN · Terhubung</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="admInstallBtn" type="button" onclick="triggerAdminPwaInstall()" class="hidden px-2.5 py-1.5 rounded-lg bg-emerald-600 text-white text-[10px] font-extrabold">Instal</button>
        <button type="button" onclick="refreshAdminData(false)" class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-white text-sm" title="Sinkronkan Data">↻</button>
        <button type="button" onclick="lockAppNow()" class="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-300 flex items-center justify-center text-sm" title="Kunci Layar PIN">🔒</button>
      </div>
    </div>
  </header>

  <!-- ============================================================
       MAIN MOBILE WORKSPACE (5 DEDICATED ADMIN TABS)
       ============================================================ -->
  <main id="adminWorkspace" class="max-w-2xl mx-auto pt-20 px-3.5 space-y-5 text-xs">
    <!-- Dynamically rendered per active tab -->
  </main>

  <!-- ============================================================
       BOTTOM NAVIGATION BAR (5 MOBILE ADMIN TABS)
       ============================================================ -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0d1018]/95 backdrop-blur-xl border-t border-white/10 safe-bottom">
    <div class="max-w-2xl mx-auto grid grid-cols-5 pt-2 pb-1 text-[10px] font-bold">
      <button type="button" data-atab="dashboard" onclick="switchTab('dashboard')" class="atab flex flex-col items-center gap-0.5 text-amber-400"><span>📊</span><span>Dashboard</span></button>
      <button type="button" data-atab="content" onclick="switchTab('content')" class="atab flex flex-col items-center gap-0.5 text-zinc-400"><span>🎬</span><span>Konten</span></button>
      <button type="button" data-atab="drive" onclick="switchTab('drive')" class="atab flex flex-col items-center gap-0.5 text-zinc-400"><span>☁️</span><span>Drive</span></button>
      <button type="button" data-atab="commerce" onclick="switchTab('commerce')" class="atab flex flex-col items-center gap-0.5 text-zinc-400"><span>🎟️</span><span>VIP/User</span></button>
      <button type="button" data-atab="system" onclick="switchTab('system')" class="atab flex flex-col items-center gap-0.5 text-zinc-400"><span>⚙️</span><span>Sistem</span></button>
    </div>
  </nav>

  <div id="admToast" class="fixed top-20 left-1/2 -translate-x-1/2 z-[200] w-[92%] max-w-sm space-y-2 pointer-events-none"></div>

  <script>
    const lsGet = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
    const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    const RBAC = {
      SUPER_ADMIN: ['*'],
      CONTENT_ADMIN: ['dashboard','content'],
      VIDEO_MANAGER: ['dashboard','drive'],
      MEMBERSHIP_ADMIN: ['dashboard','commerce'],
      FINANCE_ADMIN: ['dashboard','commerce'],
      MODERATOR: ['dashboard','commerce','system'],
      ANALYTICS_VIEWER: ['dashboard']
    };

    const st = {
      gasUrl: lsGet('adbr_adm_gas_v5', ''),
      session: lsGet('adbr_adm_sess_v5', null),
      pinHash: lsGet('adbr_adm_pin_v5', ''),
      tab: 'dashboard',
      period: 'month',
      cmsFilter: 'ALL',
      subTabCommerce: 'vouchers',
      deferredInstall: null,
      lastActivity: Date.now(),
      data: lsGet('adbr_adm_cache_v5', {
        catalog: [], episodes: [], vouchers: [], users: [], transactions: [],
        promos: [], videoJobs: [], driveLogs: [], auditLogs: [], notifications: []
      })
    };

    function toast(msg, type='info') {
      const box = document.getElementById('admToast');
      const cls = type==='ok' ? 'bg-emerald-600 text-white' : type==='err' ? 'bg-red-600 text-white' : 'bg-amber-500 text-black';
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-2xl text-xs font-extrabold shadow-2xl text-center ${cls}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => el.remove(), 3400);
    }

    function copyText(text, msg) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(msg || 'Berhasil disalin!', 'ok'); } catch { toast('Gagal salin otomatis.', 'err'); }
      document.body.removeChild(ta);
    }

    function extractDriveId(v) {
      const s = String(v||'').trim();
      const m = s.match(/\/file\/d\/([a-zA-Z0-9_-]{10,})/) || s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
      return m ? m[1] : s;
    }

    async function gasCall(path, body={}) {
      if (!st.gasUrl) throw new Error('URL Google Apps Script belum diisi.');
      const res = await fetch(st.gasUrl, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ path, method: 'POST', token: (st.session && st.session.token) || '', body })
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) throw new Error(data.error || 'Error Apps Script');
      return data;
    }

    /* ----- SECURITY: LOGIN, PIN LOCK & IDLE TIMEOUT ----- */
    async function handleAdminLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('admLoginBtn');
      const url = document.getElementById('admGasUrl').value.trim();
      const email = document.getElementById('admEmail').value.trim().toLowerCase();
      const password = document.getElementById('admPass').value;
      const totpCode = document.getElementById('admTotp').value.trim();
      btn.disabled = true; btn.textContent = 'Memverifikasi...';
      try {
        st.gasUrl = url;
        lsSet('adbr_adm_gas_v5', url);
        const resp = await gasCall('/api/auth/login', { email, password, totpCode });
        const role = String((resp.user && resp.user.role) || 'USER').toUpperCase();
        if (role === 'USER') throw new Error('Akun ini bukan Admin. Akses CMS ditolak!');
        st.session = { token: resp.token, user: resp.user, offline: false };
        lsSet('adbr_adm_sess_v5', st.session);
        document.getElementById('adminLoginGate').classList.add('hidden');
        await refreshAdminData(true);
        toast('Login Admin terverifikasi (' + role + ')!', 'ok');
      } catch (err) {
        toast(err.message, 'err');
      } finally {
        btn.disabled = false; btn.textContent = 'Masuk ke Panel Admin';
      }
    }

    function enterOfflineDemoAdmin() {
      st.session = { token: '', user: { email: 'owner@offline', displayName: 'Owner Preview', role: 'SUPER_ADMIN' }, offline: true };
      lsSet('adbr_adm_sess_v5', st.session);
      document.getElementById('adminLoginGate').classList.add('hidden');
      renderWorkspace();
      toast('Mode Preview Offline aktif. Hubungkan Apps Script di tab Sistem untuk data live.', 'info');
    }

    function logoutAdminSession() {
      st.session = null;
      lsSet('adbr_adm_sess_v5', null);
      document.getElementById('pinLockOverlay').classList.add('hidden');
      document.getElementById('adminLoginGate').classList.remove('hidden');
      toast('Sesi Admin telah keluar.', 'info');
    }

    function lockAppNow() {
      if (!st.pinHash) {
        toast('Atur PIN Kunci 6 digit dulu di tab Sistem.', 'info');
        switchTab('system');
        return;
      }
      document.getElementById('pinUnlockInput').value = '';
      document.getElementById('pinLockOverlay').classList.remove('hidden');
    }

    function verifyAppLockPin() {
      const inp = document.getElementById('pinUnlockInput').value.trim();
      if (btoa(inp) === st.pinHash) {
        document.getElementById('pinLockOverlay').classList.add('hidden');
        st.lastActivity = Date.now();
        toast('Kunci dibuka.', 'ok');
      } else {
        toast('PIN salah!', 'err');
      }
    }

    function saveAppLockPin(e) {
      e.preventDefault();
      const pin = document.getElementById('sysPinInput').value.trim();
      if (!/^\d{6}$/.test(pin)) { toast('PIN harus tepat 6 angka.', 'err'); return; }
      st.pinHash = btoa(pin);
      lsSet('adbr_adm_pin_v5', st.pinHash);
      e.target.reset();
      toast('PIN Kunci Aplikasi 6 digit aktif! Auto-lock 5 menit idle.', 'ok');
    }

    ['click','touchstart','keydown'].forEach(ev => window.addEventListener(ev, () => { st.lastActivity = Date.now(); }, { passive:true }));
    setInterval(() => {
      if (st.session && st.pinHash && Date.now() - st.lastActivity > 5 * 60 * 1000) {
        document.getElementById('pinLockOverlay').classList.remove('hidden');
      }
    }, 15000);

    /* ----- DATA SYNC FROM APPS SCRIPT ----- */
    async function refreshAdminData(silent=false) {
      if (!st.gasUrl || !st.session || st.session.offline) {
        renderWorkspace();
        return;
      }
      try {
        const [boot, adm] = await Promise.all([
          gasCall('/api/bootstrap', {}),
          gasCall('/api/admin/state', {})
        ]);
        st.data.catalog = boot.catalog || [];
        st.data.episodes = boot.episodes || [];
        st.data.users = adm.users || [];
        st.data.transactions = adm.transactions || [];
        st.data.promos = adm.promos || [];
        st.data.videoJobs = adm.videoJobs || [];
        st.data.driveLogs = adm.driveLogs || [];
        st.data.auditLogs = adm.auditLogs || [];
        st.data.notifications = adm.notifications || [];
        lsSet('adbr_adm_cache_v5', st.data);
        renderWorkspace();
        if (!silent) toast('Data aktual tersinkronisasi dari Apps Script!', 'ok');
      } catch (err) {
        if (!silent) toast('Sync error: ' + err.message, 'err');
      }
    }

    /* ----- NAVIGATION & RBAC ----- */
    function hasPerm(tab) {
      const role = (st.session && st.session.user && st.session.user.role) || 'SUPER_ADMIN';
      const allow = RBAC[role] || [];
      return allow.includes('*') || allow.includes(tab);
    }

    function switchTab(tab) {
      st.tab = tab;
      document.querySelectorAll('.atab').forEach(b => {
        const active = b.getAttribute('data-atab') === tab;
        b.className = active ? 'atab flex flex-col items-center gap-0.5 text-amber-400' : 'atab flex flex-col items-center gap-0.5 text-zinc-400';
      });
      renderWorkspace();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function renderWorkspace() {
      const role = (st.session && st.session.user && st.session.user.role) || 'SUPER_ADMIN';
      document.getElementById('hdrRoleBadge').textContent = `${role} · ${st.session && !st.session.offline ? 'Apps Script Live' : 'Mode Offline'}`;
      const ws = document.getElementById('adminWorkspace');

      if (!hasPerm(st.tab)) {
        ws.innerHTML = `<div class="p-6 rounded-2xl bg-red-950/40 border border-red-500/40 text-center space-y-1"><p class="text-sm font-black text-red-300">Akses Ditolak (RBAC)</p><p class="text-zinc-300">Role ${esc(role)} tidak memiliki izin untuk tab ini.</p></div>`;
        return;
      }

      if (st.tab === 'dashboard') renderDashboard(ws);
      else if (st.tab === 'content') renderContentTab(ws);
      else if (st.tab === 'drive') renderDriveTab(ws);
      else if (st.tab === 'commerce') renderCommerceTab(ws);
      else if (st.tab === 'system') renderSystemTab(ws);
    }

    /* ----- TAB 1: DASHBOARD ----- */
    function renderDashboard(ws) {
      const d = st.data;
      const animeCnt = d.catalog.filter(c => String(c.type).toLowerCase() !== 'movie').length;
      const movieCnt = d.catalog.filter(c => String(c.type).toLowerCase() === 'movie').length;
      const vipCnt = d.users.filter(u => u.tier === 'VIP').length;
      const rev = d.transactions.filter(t => t.status === 'PAID').reduce((s,t) => s + Number(t.finalAmount||0), 0);

      const cards = [
        ['Total Anime', animeCnt, 'text-white'], ['Total Film', movieCnt, 'text-white'],
        ['Total Episode', d.episodes.length, 'text-white'], ['Total User', d.users.length, 'text-white'],
        ['VIP Aktif', vipCnt, 'text-amber-400'], ['Pengguna Gratis', Math.max(0, d.users.length - vipCnt), 'text-zinc-300'],
        ['Transaksi', d.transactions.length, 'text-white'], ['Pendapatan PAID', 'Rp ' + rev.toLocaleString('id-ID'), 'text-emerald-400']
      ];

      ws.innerHTML = `
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-base font-black text-white">Statistik Aktual</h2>
          <div class="flex gap-1">
            ${[['day','Hari'],['week','Minggu'],['month','Bulan'],['year','Tahun']].map(([k,l]) =>
              `<button type="button" onclick="st.period='${k}'; renderWorkspace()" class="px-2.5 py-1 rounded-lg font-bold text-[10px] ${st.period===k?'bg-brand text-white':'bg-white/10 text-zinc-300'}">${l}</button>`
            ).join('')}
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          ${cards.map(([k,v,cls]) => `<div class="p-3.5 rounded-2xl bg-panel border border-white/10"><p class="text-[10px] text-zinc-400 uppercase font-bold">${k}</p><p class="text-lg font-black ${cls} mt-0.5">${esc(v)}</p></div>`).join('')}
        </div>
        <div class="p-4 rounded-2xl bg-panel border border-white/10 space-y-2">
          <h3 class="font-extrabold text-amber-300">Status Queue Video &amp; Storage</h3>
          <p class="text-zinc-300">Total Job Drive: <strong>${d.videoJobs.length}</strong> · Siap Tayang: <strong>${d.videoJobs.filter(j=>j.status==='READY').length}</strong></p>
          <p class="text-[11px] text-zinc-400">Database: Google Sheets (12 Tab via Apps Script) · Master Video: Private Google Drive</p>
        </div>`;
    }

    /* ----- TAB 2: KONTEN & DUAL SUB PREVIEW ----- */
    function renderContentTab(ws) {
      ws.innerHTML = `
        <form onsubmit="submitNewContent(event)" class="p-4 rounded-2xl bg-panel border border-white/10 space-y-3">
          <h3 class="text-sm font-extrabold text-white">+ Tambah Anime / Film Baru</h3>
          <input id="cTitle" required placeholder="Judul Indonesia *" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white" />
          <input id="cTitleAr" dir="rtl" required placeholder="Judul Arab (العربية) *" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-amber-300 font-arabic" />
          <div class="grid grid-cols-2 gap-2">
            <select id="cKind" class="bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white"><option value="ANIME">Anime</option><option value="MOVIE">Movie</option><option value="SERIES">Series</option><option value="OVA">OVA</option><option value="SPECIAL">Special</option></select>
            <select id="cPub" class="bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white"><option value="PUBLISHED">Published</option><option value="DRAFT">Draft</option><option value="SCHEDULED">Scheduled</option><option value="UPCOMING">Upcoming</option></select>
          </div>
          <input id="cDrive" placeholder="Link / File ID Google Drive Episode 1" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-emerald-300 font-mono" />
          <textarea id="cSyn" rows="2" placeholder="Sinopsis..." class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white"></textarea>
          <div class="flex items-center justify-between">
            <label class="inline-flex items-center gap-2"><input id="cVip" type="checkbox" class="accent-amber-400 w-4 h-4" /><span class="text-amber-300 font-bold">Konten VIP</span></label>
            <button type="submit" class="px-4 py-2 rounded-xl bg-brand text-white font-bold">Simpan ke Database</button>
          </div>
        </form>

        <div class="p-4 rounded-2xl bg-panel border border-white/10 space-y-2.5">
          <h3 class="font-extrabold text-amber-300">Live Preview Dual Subtitle (RTL Arab + Indo)</h3>
          <input id="subPrevArInp" dir="rtl" value="الحقيقة دائماً واحدة مهما كانت الألغاز معقدة!" oninput="document.getElementById('subOutAr').textContent=this.value" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 font-arabic text-amber-300" />
          <input id="subPrevIdInp" value="Kebenaran selalu hanya satu, serumit apa pun misterinya!" oninput="document.getElementById('subOutId').textContent=this.value" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white" />
          <div class="p-4 rounded-xl bg-black border border-white/10 text-center space-y-1">
            <div id="subOutAr" dir="rtl" class="font-arabic font-bold text-base text-amber-300">الحقيقة دائماً واحدة مهما كانت الألغاز معقدة!</div>
            <div id="subOutId" class="font-sans font-semibold text-xs text-white">Kebenaran selalu hanya satu, serumit apa pun misterinya!</div>
          </div>
        </div>

        <div class="space-y-2">
          <h3 class="font-extrabold text-white">Daftar Katalog (${st.data.catalog.length})</h3>
          ${st.data.catalog.length ? st.data.catalog.slice(0,25).map(c => `
            <div class="p-3 rounded-xl bg-panel border border-white/10 flex items-center justify-between gap-2">
              <div class="min-w-0">
                <p class="font-bold text-white truncate">${esc(c.title)}</p>
                <p class="text-[10px] text-zinc-400">${esc(c.publishStatus||'PUBLISHED')} · ${String(c.isVip).toUpperCase()==='TRUE'?'VIP':'GRATIS'}</p>
              </div>
              <button type="button" onclick="togglePublish('${esc(c.id)}','${String(c.publishStatus)==='ARCHIVED'?'PUBLISHED':'ARCHIVED'}')" class="px-2.5 py-1 rounded-lg bg-white/10 text-zinc-200 font-bold shrink-0">${String(c.publishStatus)==='ARCHIVED'?'Publish':'Arsip'}</button>
            </div>`).join('') : '<p class="p-4 rounded-xl bg-panel text-center text-zinc-500">Belum ada konten di Spreadsheet.</p>'}
        </div>`;
    }

    async function submitNewContent(e) {
      e.preventDefault();
      const title = document.getElementById('cTitle').value.trim();
      const kind = document.getElementById('cKind').value;
      const item = {
        id: 'cnt-' + Date.now(),
        title,
        arabicTitle: document.getElementById('cTitleAr').value.trim(),
        type: kind === 'MOVIE' ? 'movie' : 'anime',
        kind,
        publishStatus: document.getElementById('cPub').value,
        isVip: document.getElementById('cVip').checked,
        synopsis: document.getElementById('cSyn').value.trim(),
        seasons: [{ seasonNumber:1, title:'Season 1', episodes:[{ ep:1, title:'Episode 1', duration:'24 mnt', isVip:document.getElementById('cVip').checked, driveSubId: extractDriveId(document.getElementById('cDrive').value) }] }]
      };
      try {
        if (st.session && !st.session.offline) await gasCall('/api/admin/contents', { item });
        st.data.catalog.unshift({ id:item.id, title:item.title, titleAr:item.arabicTitle, type:item.type, publishStatus:item.publishStatus, isVip:item.isVip?'TRUE':'FALSE' });
        lsSet('adbr_adm_cache_v5', st.data);
        e.target.reset(); renderWorkspace(); toast('Konten tersimpan!', 'ok');
      } catch (err) { toast(err.message, 'err'); }
    }

    async function togglePublish(id, nextState) {
      try {
        if (st.session && !st.session.offline) await gasCall('/api/admin/contents/' + encodeURIComponent(id) + '/status', { publishStatus: nextState });
        const it = st.data.catalog.find(c => c.id === id);
        if (it) it.publishStatus = nextState;
        renderWorkspace(); toast('Status diubah ke ' + nextState, 'ok');
      } catch (err) { toast(err.message, 'err'); }
    }

    /* ----- TAB 3: GOOGLE DRIVE & JOBS ----- */
    function renderDriveTab(ws) {
      ws.innerHTML = `
        <form onsubmit="submitDriveImport(event)" class="p-4 rounded-2xl bg-panel border border-emerald-500/30 space-y-3">
          <h3 class="text-sm font-extrabold text-emerald-300">Import &amp; Validasi Video Private Google Drive</h3>
          <input id="dEpId" required placeholder="ID Konten / Episode Target" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white" />
          <input id="dFileId" required placeholder="Tempel Link Share atau File ID Google Drive" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-amber-300 font-mono" />
          <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold">Validasi di Server Apps Script</button>
        </form>
        <div class="space-y-2">
          <h3 class="font-extrabold text-white">Antrian &amp; Status Video Jobs (${st.data.videoJobs.length})</h3>
          ${st.data.videoJobs.map(j => `
            <div class="p-3 rounded-xl bg-panel border border-white/10 flex items-center justify-between gap-2">
              <div class="min-w-0"><p class="font-bold text-white truncate">${esc(j.title||j.fileName)}</p><p class="text-[10px] text-zinc-400">${esc(j.status)} · ${esc(j.stage)}</p></div>
              <button type="button" onclick="retryJob('${esc(j.id)}')" class="px-2.5 py-1 rounded-lg bg-white/10 font-bold">Retry</button>
            </div>`).join('') || '<p class="p-4 rounded-xl bg-panel text-center text-zinc-500">Belum ada job Drive.</p>'}
        </div>`;
    }

    async function submitDriveImport(e) {
      e.preventDefault();
      const episodeId = document.getElementById('dEpId').value.trim();
      const gdriveFileId = extractDriveId(document.getElementById('dFileId').value);
      try {
        if (st.session && !st.session.offline) {
          const resp = await gasCall('/api/drive/import', { episodeId, gdriveFileId, mode: 'FILE_ID' });
          st.data.videoJobs.unshift(resp.job);
        } else {
          st.data.videoJobs.unshift({ id:'job-'+Date.now(), title:gdriveFileId, status:'READY', stage:'OFFLINE_PREVIEW' });
        }
        e.target.reset(); renderWorkspace(); toast('File Google Drive divalidasi!', 'ok');
      } catch (err) { toast(err.message, 'err'); }
    }

    async function retryJob(jobId) {
      try {
        if (st.session && !st.session.offline) await gasCall('/api/drive/jobs/' + encodeURIComponent(jobId) + '/retry', {});
        toast('Job dijadwalkan ulang!', 'ok'); refreshAdminData(true);
      } catch (err) { toast(err.message, 'err'); }
    }

    /* ----- TAB 4: VIP VOUCHERS, PAYMENTS & USERS ----- */
    function renderCommerceTab(ws) {
      const sub = st.subTabCommerce;
      ws.innerHTML = `
        <div class="grid grid-cols-3 gap-1.5 font-bold">
          <button type="button" onclick="st.subTabCommerce='vouchers'; renderWorkspace()" class="py-2 rounded-xl ${sub==='vouchers'?'vip-gradient text-black':'bg-panel text-zinc-300'}">Voucher VIP</button>
          <button type="button" onclick="st.subTabCommerce='payments'; renderWorkspace()" class="py-2 rounded-xl ${sub==='payments'?'vip-gradient text-black':'bg-panel text-zinc-300'}">Transaksi (${st.data.transactions.length})</button>
          <button type="button" onclick="st.subTabCommerce='users'; renderWorkspace()" class="py-2 rounded-xl ${sub==='users'?'vip-gradient text-black':'bg-panel text-zinc-300'}">Users (${st.data.users.length})</button>
        </div>
        <div id="commerceSubBody" class="space-y-3"></div>`;

      const body = document.getElementById('commerceSubBody');
      if (sub === 'vouchers') {
        body.innerHTML = `
          <form onsubmit="createPromoOrVoucher(event)" class="p-4 rounded-2xl bg-panel border border-amber-500/30 space-y-2.5">
            <div class="flex justify-between items-center"><h4 class="font-extrabold text-amber-400">Generator Kode Voucher &amp; Salin WA</h4><button type="button" onclick="genRandomCode()" class="px-2.5 py-1 rounded-lg bg-amber-500/20 text-amber-300 font-bold">Acak Kode</button></div>
            <input id="vCode" required placeholder="ADBR-XXXX-XXXX" oninput="this.value=this.value.toUpperCase()" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 font-mono font-bold text-amber-300" />
            <div class="grid grid-cols-2 gap-2">
              <input id="vPlan" value="VIP Bulanan 30 Hari" class="bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white" />
              <input id="vDays" type="number" value="30" class="bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl vip-gradient text-black font-extrabold">Buat Voucher &amp; Salin Pesan WA</button>
          </form>
          <form onsubmit="submitPromo(event)" class="p-4 rounded-2xl bg-panel border border-white/10 flex gap-2">
            <input id="pCode" required placeholder="Kode Promo (cth: ARAB20)" oninput="this.value=this.value.toUpperCase()" class="flex-1 bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 font-mono text-amber-300" />
            <input id="pPct" type="number" value="20" min="1" max="100" class="w-16 bg-[#0a0d14] border border-white/10 rounded-xl px-2 py-2 text-white" />
            <button type="submit" class="px-3.5 py-2 rounded-xl bg-brand text-white font-bold">+ Promo</button>
          </form>`;
      } else if (sub === 'payments') {
        body.innerHTML = st.data.transactions.length ? st.data.transactions.map(t => `
          <div class="p-3.5 rounded-xl bg-panel border border-white/10 space-y-2">
            <div class="flex justify-between"><strong class="font-mono text-amber-300">${esc(t.invoiceNumber)}</strong><span class="px-2 py-0.5 rounded bg-white/10 text-[10px] font-black">${esc(t.status)}</span></div>
            <p class="text-zinc-400">${esc(t.userEmail)} · ${esc(t.planName)} · Rp ${Number(t.finalAmount||0).toLocaleString('id-ID')}</p>
            <div class="flex gap-2">
              <button type="button" onclick="setPayment('${esc(t.invoiceNumber)}','PAID')" class="flex-1 py-1.5 rounded-lg bg-emerald-600/25 text-emerald-300 font-bold">Konfirmasi PAID</button>
              <button type="button" onclick="setPayment('${esc(t.invoiceNumber)}','REFUNDED')" class="px-3 py-1.5 rounded-lg bg-red-600/20 text-red-300 font-bold">Refund</button>
            </div>
          </div>`).join('') : '<p class="p-5 rounded-xl bg-panel text-center text-zinc-500">Belum ada transaksi.</p>';
      } else {
        body.innerHTML = st.data.users.length ? st.data.users.map(u => `
          <div class="p-3.5 rounded-xl bg-panel border border-white/10 space-y-2">
            <div class="flex justify-between"><strong class="text-white">${esc(u.displayName)}</strong><span class="px-2 py-0.5 rounded text-[10px] font-black ${u.tier==='VIP'?'vip-gradient text-black':'bg-white/10 text-zinc-200'}">${esc(u.tier)}</span></div>
            <p class="text-zinc-400">${esc(u.email)} · Status: ${esc(u.status)}</p>
            <div class="flex gap-1.5">
              <button type="button" onclick="setUser('${esc(u.id)}','VIP','ACTIVE')" class="flex-1 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 font-bold">+30h VIP Manual</button>
              <button type="button" onclick="setUser('${esc(u.id)}',null,'SUSPENDED')" class="px-2.5 py-1.5 rounded-lg bg-white/10 text-zinc-200 font-bold">Suspend</button>
              <button type="button" onclick="setUser('${esc(u.id)}',null,'BANNED')" class="px-2.5 py-1.5 rounded-lg bg-red-600/20 text-red-300 font-bold">Ban</button>
            </div>
          </div>`).join('') : '<p class="p-5 rounded-xl bg-panel text-center text-zinc-500">Belum ada pengguna.</p>';
      }
    }

    function genRandomCode() {
      const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const mk = () => Array.from({length:4}, () => ch[Math.floor(Math.random()*ch.length)]).join('');
      document.getElementById('vCode').value = `ADBR-${mk()}-${mk()}`;
    }

    function createPromoOrVoucher(e) {
      e.preventDefault();
      const code = document.getElementById('vCode').value.trim().toUpperCase();
      const plan = document.getElementById('vPlan').value.trim();
      const days = Number(document.getElementById('vDays').value) || 30;
      const msg = `Terima kasih berlangganan *Animedubar VIP*!\n\nPaket: *${plan}* (${days} Hari)\nKode Voucher: *${code}*\n\nCara Aktivasi:\n1. Buka Aplikasi HP Animedubar\n2. Ketuk tombol *★ VIP* → *Login Voucher VIP*\n3. Masukkan kode *${code}*`;
      copyText(msg, `Voucher ${code} & pesan WA disalin! Tempel baris kode di tab Voucher Sheets.`);
    }

    async function submitPromo(e) {
      e.preventDefault();
      const code = document.getElementById('pCode').value.trim().toUpperCase();
      const discountPct = Number(document.getElementById('pPct').value) || 20;
      try {
        if (st.session && !st.session.offline) await gasCall('/api/admin/promos', { code, discountPct });
        toast(`Promo ${code} (${discountPct}%) tersimpan!`, 'ok'); e.target.reset();
      } catch (err) { toast(err.message, 'err'); }
    }

    async function setPayment(inv, status) {
      try {
        if (st.session && !st.session.offline) await gasCall('/api/admin/payments/' + encodeURIComponent(inv) + '/status', { status });
        toast(`Invoice ${inv} → ${status}`, 'ok'); refreshAdminData(true);
      } catch (err) { toast(err.message, 'err'); }
    }

    async function setUser(uid, tier, status) {
      try {
        if (st.session && !st.session.offline) await gasCall('/api/admin/users/' + encodeURIComponent(uid) + '/update', { tier, status, days:30 });
        toast('User diperbarui!', 'ok'); refreshAdminData(true);
      } catch (err) { toast(err.message, 'err'); }
    }

    /* ----- TAB 5: SISTEM, BROADCAST, AUDIT & PIN KEAMANAN ----- */
    function renderSystemTab(ws) {
      ws.innerHTML = `
        <form onsubmit="sendBroadcast(event)" class="p-4 rounded-2xl bg-panel border border-white/10 space-y-2.5">
          <h3 class="text-sm font-extrabold text-white">Kirim Broadcast Notifikasi ke Aplikasi Pelanggan</h3>
          <input id="bcT" required placeholder="Judul Pengumuman / Episode Baru *" class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white" />
          <textarea id="bcB" required rows="2" placeholder="Isi pesan..." class="w-full bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 text-white"></textarea>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-brand text-white font-bold">Kirim Broadcast</button>
        </form>

        <form onsubmit="saveAppLockPin(event)" class="p-4 rounded-2xl bg-panel border border-amber-500/30 space-y-2.5">
          <h3 class="text-sm font-extrabold text-amber-300">Keamanan HP Admin — Kunci PIN 6 Digit</h3>
          <p class="text-[11px] text-zinc-400">Otomatis mengunci aplikasi CMS jika HP tidak aktif 5 menit.</p>
          <div class="flex gap-2">
            <input id="sysPinInput" type="password" inputmode="numeric" maxlength="6" required placeholder="6 digit angka" class="flex-1 bg-[#0a0d14] border border-white/10 rounded-xl px-3 py-2 font-mono text-amber-300" />
            <button type="submit" class="px-4 py-2 rounded-xl vip-gradient text-black font-extrabold">Simpan PIN</button>
          </div>
        </form>

        <div class="p-4 rounded-2xl bg-panel border border-white/10 space-y-2">
          <h3 class="font-extrabold text-white">Audit Log Terbaru (${st.data.auditLogs.length})</h3>
          ${st.data.auditLogs.slice(0,10).map(a => `<div class="py-1.5 border-b border-white/5 text-[11px]"><strong class="text-amber-300">${esc(a.role)}</strong> · ${esc(a.action)} (${esc(a.entityId)})</div>`).join('') || '<p class="text-zinc-500">Belum ada audit log.</p>'}
        </div>

        <button type="button" onclick="logoutAdminSession()" class="w-full py-3 rounded-2xl bg-red-600/20 border border-red-500/40 text-red-200 font-extrabold">Logout Sesi Admin</button>`;
    }

    async function sendBroadcast(e) {
      e.preventDefault();
      try {
        if (st.session && !st.session.offline) await gasCall('/api/admin/notifications/broadcast', { title: document.getElementById('bcT').value.trim(), body: document.getElementById('bcB').value.trim(), category:'BROADCAST' });
        e.target.reset(); toast('Broadcast berhasil dikirim!', 'ok');
      } catch (err) { toast(err.message, 'err'); }
    }

    /* ----- PWA INSTALL ----- */
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      st.deferredInstall = e;
      document.getElementById('admInstallBtn').classList.remove('hidden');
    });

    async function triggerAdminPwaInstall() {
      if (st.deferredInstall) {
        st.deferredInstall.prompt();
        await st.deferredInstall.userChoice;
        st.deferredInstall = null;
        return;
      }
      toast('Di Chrome Android: ketuk menu (⋮) → "Instal Aplikasi". Di Safari iOS: Share → "Tambahkan ke Layar Utama".', 'info');
    }

    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
      document.getElementById('admGasUrl').value = st.gasUrl || '';
      if (st.session) {
        document.getElementById('adminLoginGate').classList.add('hidden');
        if (st.pinHash) document.getElementById('pinLockOverlay').classList.remove('hidden');
        refreshAdminData(true);
      }
    });
  </script>
</body>
</html>
